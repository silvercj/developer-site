name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy placeholders
        run: |
          # Any PLACEHOLDER_ token blocks deployment, including the commented
          # ANALYTICS:POSTHOG block in the privacy notice: apply it or delete it.
          if grep -rn "PLACEHOLDER_" public/; then
            echo "::error::Unresolved PLACEHOLDER_ values in public/. Fill them in before deploying."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
